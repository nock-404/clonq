# A tag like v0.2.0 builds clonq for Apple silicon, signs the update with the
# updater key and publishes a release with latest.json, which the app polls.
name: release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    permissions:
      contents: write
    # macOS 26 on arm64: the SDK has NSGlassEffectView, which native/glass.m uses.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # rsync (built from source) and rclone go into the app bundle.
      - run: ./scripts/fetch-tools.sh

      # The day licences compare against (src-tauri/build.rs), fixed for this release.
      - run: echo "CLONQ_RELEASE_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # clonq Pro: the licence service's public key and address, as repository variables.
          # Without the key a release keeps Pro locked (see src-tauri/src/licence.rs).
          CLONQ_LICENCE_PUBLIC_KEY: ${{ vars.CLONQ_LICENCE_PUBLIC_KEY }}
          CLONQ_LICENCE_SERVICE: ${{ vars.CLONQ_LICENCE_SERVICE }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: clonq ${{ github.ref_name }}
          releaseBody: |
            Install or update:

                curl -fsSL https://raw.githubusercontent.com/nock-404/clonq/main/install.sh | sh

            An installed clonq also offers the update by itself.

            Includes rclone 1.75.1 (MIT) and rsync 3.5.1 (GPLv3, source: https://download.samba.org/pub/rsync/src/rsync-3.5.1.tar.gz).
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin

      # A copy under a fixed name, so the website can always link
      # https://github.com/nock-404/clonq/releases/latest/download/clonq-mac.dmg
      - name: fixed-name download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/clonq_*_aarch64.dmg | head -1)
          cp "$dmg" clonq-mac.dmg
          gh release upload "${{ github.ref_name }}" clonq-mac.dmg --clobber

      # tauri-action points latest.json at api.github.com, which allows 60 unauthenticated
      # requests per hour and address; past that the update download fails with 403.
      # The plain download link has no such limit. The signature covers the file, not the URL.
      - name: direct download links in latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          gh release download "$tag" --pattern latest.json --clobber
          name=$(gh release view "$tag" --json assets --jq '.assets[].name | select(endswith(".app.tar.gz"))')
          jq --arg url "https://github.com/${{ github.repository }}/releases/download/$tag/$name" \
            '.platforms |= map_values(.url = $url)' latest.json > latest.fixed.json
          mv latest.fixed.json latest.json
          gh release upload "$tag" latest.json --clobber
