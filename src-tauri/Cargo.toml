[package]
name = "clonq"
version = "0.3.0"
description = "Sync and backup for macOS"
authors = ["nock-404"]
edition = "2024"
rust-version = "1.98"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (cargo#8519).
name = "clonq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1.4.7"

[dependencies]
tauri = { version = "2.11.6", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"
notify = "8.2.0"
trash = "5.2.9"
base64 = "0.23.1"
libc = "0.2.189"
plist = "1.10.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"
security-framework-sys = "2.17.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time", "fs"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.20"
sys-locale = "0.3.2"
regex = "1.13.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
